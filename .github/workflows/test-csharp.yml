name: C# Tests

on:
  push:
    paths:
      - 'src/csharp/**'
      - 'tests/csharp/**'
      - 'scripts/test-csharp.sh'
      - '.github/workflows/test-csharp.yml'
  pull_request:
    paths:
      - 'src/csharp/**'
      - 'tests/csharp/**'
      - 'scripts/test-csharp.sh'
      - '.github/workflows/test-csharp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run C# tests
        run: |
          chmod +x scripts/test-csharp.sh
          ./scripts/test-csharp.sh